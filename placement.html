<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="承語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>程度小考 · 承語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261008210201">
<link rel="stylesheet" href="lingo.css?v=20261008210201">
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div id="lockLoading" class="lock-card hidden">
      <h1>承語</h1>
      <p>登入中…</p>
    </div>
    <form id="lockForm" class="lock-card">
      <h1>承語</h1>
      <input id="passwordInput" type="password" placeholder="輸入密碼" autocomplete="off" required>
      <button type="submit">解鎖</button>
      <p id="lockError" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div>
        <h1>程度小考</h1>
        <p class="progress-line"><a href="index.html" class="back-link">← 返回</a></p>
      </div>
      <div class="header-actions">
        <button id="logoutBtn" class="ghost-btn">登出</button>
      </div>
    </header>

    <main>
      <div class="lingo-tabs" role="group" aria-label="語言">
        <button type="button" class="ghost-btn placement-lang" data-lang="en">English</button>
        <button type="button" class="ghost-btn placement-lang" data-lang="ja">日本語</button>
      </div>

      <section id="startBox" class="card">
        <p id="startLead" class="placement-lead"></p>
        <button id="startBtn" type="button">開始</button>
        <div id="historyBox"></div>
        <details class="placement-guide" id="guideStart"><summary>等級是什麼意思？</summary><div id="guideStartBody"></div></details>
      </section>

      <section id="quizBox" class="card hidden">
        <div class="placement-bar"><div id="barFill"></div></div>
        <p id="progressText" class="placement-progress"></p>
        <p id="questionText" class="placement-q"></p>
        <div id="optionList" class="placement-options"></div>
        <button id="unsureBtn" type="button" class="ghost-btn">我不確定</button>
      </section>

      <section id="resultBox" class="card hidden">
        <p class="placement-level-label">你的程度大約是</p>
        <p id="levelBig" class="placement-level"></p>
        <p id="levelHint" class="placement-hint"></p>
        <div id="skillRows" class="placement-skills"></div>
        <div id="bandTable"></div>
        <details class="placement-guide" id="guideResult"><summary>這個等級是什麼意思？</summary><div id="guideResultBody"></div></details>
        <p id="commentText" class="placement-comment"></p>
        <label class="placement-note">備註（選填，例如這次的狀況）
          <textarea id="noteInput" rows="2" maxlength="500"></textarea>
        </label>
        <div class="placement-save">
          <button id="saveNoteBtn" type="button" class="ghost-btn">儲存備註</button>
          <span id="saveStatus"></span>
        </div>
        <details id="wrongBox" class="placement-wrong"><summary id="wrongSummary"></summary><div id="wrongList"></div></details>
        <p class="placement-tip">這是粗略的估計，不是正式檢定。每隔幾週到幾個月再考一次，就能看到自己的進步。</p>
        <button id="againBtn" type="button" class="ghost-btn">回到小考首頁</button>
      </section>
    </main>

    <p id="statusLine" class="status-line"></p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="dialogModal" class="modal-overlay hidden">
    <div class="modal-card dialog-card">
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button id="dialogCancelBtn" class="ghost-btn" type="button">取消</button>
        <button id="dialogOkBtn" type="button">確定</button>
      </div>
    </div>
  </div>

  <script src="shared.js?v=20261008210201"></script>
  <script src="placement-score.js?v=20261008210201"></script>
  <script src="placement.js?v=20261008210201"></script>
</body>
</html>
