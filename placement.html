<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="承語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>英文程度小考 · 承語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261008010320">
<link rel="stylesheet" href="lingo.css?v=20261008010320">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <div>
        <h1>英文程度小考</h1>
        <p class="progress-line"><a href="index.html" class="back-link">← 返回</a></p>
      </div>
    </header>

    <main>
      <section id="startBox" class="card">
        <p class="placement-lead">單字與文法共 40 題，選擇題，約 10–15 分鐘。題目從簡單排到困難，不確定就選「我不確定」，不要亂猜，結果比較準。</p>
        <p id="lastResult" class="placement-last"></p>
        <button id="startBtn" type="button">開始</button>
      </section>

      <section id="quizBox" class="card hidden">
        <div class="placement-bar"><div id="barFill"></div></div>
        <p id="progressText" class="placement-progress"></p>
        <p id="questionText" class="placement-q"></p>
        <div id="optionList" class="placement-options"></div>
        <button id="unsureBtn" type="button" class="ghost-btn">我不確定</button>
      </section>

      <section id="resultBox" class="card hidden">
        <p class="placement-level-label">你的英文程度大約是</p>
        <p id="levelBig" class="placement-level"></p>
        <p id="levelHint" class="placement-hint"></p>
        <div id="skillRows" class="placement-skills"></div>
        <div id="bandTable"></div>
        <details id="wrongBox" class="placement-wrong"><summary id="wrongSummary"></summary><div id="wrongList"></div></details>
        <p class="placement-tip">這是粗略的估計（單字、文法各約 20 題），不是正式檢定。每隔幾個月可以再考一次看進步。</p>
        <button id="againBtn" type="button" class="ghost-btn">再考一次</button>
      </section>
    </main>

    <p id="statusLine" class="status-line"></p>
  </div>

  <script src="placement-score.js?v=20261008010320"></script>
  <script src="placement.js?v=20261008010320"></script>
</body>
</html>
