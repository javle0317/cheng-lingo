<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="承語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>承語 · 每日練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261008221212">
<link rel="stylesheet" href="lingo.css?v=20261008221212">
</head>
<body class="lingo-home">

  <div id="lockScreen" class="lock-screen">
    <div id="lockLoading" class="lock-card hidden">
      <h1>承語</h1>
      <p>登入中…</p>
    </div>
    <form id="lockForm" class="lock-card">
      <h1>承語</h1>
      <input id="passwordInput" type="password" placeholder="輸入密碼" autocomplete="off" required>
      <button type="submit">解鎖</button>
      <p id="lockError" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <main>
      <section id="homeView">
        <header class="app-header">
          <div>
            <h1>承語</h1>
            <p class="progress-line"><span id="todayLine"></span></p>
          </div>
        </header>
        <p id="retestHint" class="lingo-retest hidden"></p>
        <div id="homeCards"></div>
      </section>

      <section id="sessionView" class="hidden">
        <div class="lingo-sbar">
          <button id="exitBtn" type="button" class="ghost-btn" aria-label="回到今日">← 今日</button>
          <span id="sessionTitle" class="lingo-stitle"></span>
        </div>

        <section class="card" id="cardSection">
          <div id="cardEmpty" class="empty-hint hidden">還沒有這個語言的內容，先到「內容庫」新增幾張。</div>
          <div id="cardBody" class="hidden">
            <div class="lingo-modes" role="group" aria-label="練習模式">
              <button type="button" class="ghost-btn lingo-mode" data-mode="look">看</button>
              <button type="button" class="ghost-btn lingo-mode" data-mode="recall">背</button>
              <button type="button" class="ghost-btn lingo-mode" data-mode="copy">抄</button>
            </div>

            <div class="lingo-card">
              <p id="cardType" class="lingo-type"></p>
              <p id="cardFront" class="lingo-front"></p>
              <p id="cardReading" class="lingo-reading"></p>
              <div id="speakRow" class="lingo-speak">
                <button id="speakBtn" type="button" class="lingo-speak-btn" aria-label="播放發音">🔊</button>
                <button id="slowBtn" type="button" class="ghost-btn">慢速</button>
                <button id="sentBtn" type="button" class="ghost-btn hidden">整句</button>
              </div>
              <div id="cardBackWrap">
                <p id="cardBack" class="lingo-back"></p>
                <p id="cardNote" class="lingo-note"></p>
              </div>
            </div>

            <div id="recallBox" class="lingo-copy hidden">
              <textarea id="recallInput" rows="2" placeholder="看中文，打出外文（日文可打羅馬拼音）" autocomplete="off" spellcheck="false"></textarea>
              <p id="recallResult" class="lingo-copy-result"></p>
            </div>

            <div id="copyBox" class="lingo-copy hidden">
              <button id="dictBtn" type="button" class="ghost-btn lingo-dict">聽寫：只聽不看</button>
              <textarea id="copyInput" rows="3" placeholder="照著抄一遍（日文也可以直接打羅馬拼音）" autocomplete="off" spellcheck="false"></textarea>
              <p id="copyResult" class="lingo-copy-result"></p>
            </div>

            <label id="masteredWrap" class="lingo-mastered hidden">
              <input id="masteredCheck" type="checkbox"> 我完全記得這張了，之後不用再出現
            </label>

            <a id="printLink" class="lingo-print-link hidden" href="copybook.html">🖨️ 印這一行的描紅字帖（要接印表機才需要）</a>
          </div>
        </section>

        <div id="actionsBar" class="lingo-actions-bar hidden">
          <button id="revealBtn" type="button" class="hidden">顯示答案</button>
          <div id="ratingBox" class="lingo-rating hidden">
            <p class="lingo-rating-q">剛剛想起來了嗎？</p>
            <div class="lingo-rating-row">
              <button type="button" class="ghost-btn" data-rate="forgot">忘了</button>
              <button type="button" class="ghost-btn" data-rate="fuzzy">模糊</button>
              <button type="button" data-rate="good">記得</button>
            </div>
          </div>
          <button id="doneBtn" type="button">✓ 完成今天的練習</button>
          <button id="drawBtn" type="button" class="ghost-btn">🎲 換一張</button>
        </div>
      </section>

      <section id="libraryView" class="hidden">
        <section class="card">
          <h2>內容庫（新增單字、例句、短文）</h2>
          <form id="addForm" class="lingo-form">
            <label>語言
              <select id="addLang">
                <option value="en">English</option>
                <option value="ja">日本語</option>
              </select>
            </label>
            <label>類型
              <select id="addType">
                <option value="word">單字</option>
                <option value="sentence">例句</option>
                <option value="passage">短文</option>
              </select>
            </label>
            <label>正面（要記的內容）
              <textarea id="addFront" rows="2" required></textarea>
            </label>
            <label>讀音（日文假名／英文音標，可空白）
              <input id="addReading" type="text" autocomplete="off">
            </label>
            <label>意思（中文）
              <textarea id="addBack" rows="2" required></textarea>
            </label>
            <label>備註（可空白）
              <input id="addNote" type="text" autocomplete="off">
            </label>
            <button type="submit">新增</button>
          </form>
          <ul id="cardList" class="lingo-list"></ul>
        </section>
        <section class="card">
          <button id="logoutBtn" class="ghost-btn">登出</button>
        </section>
      </section>
    </main>

    <p id="statusLine" class="status-line"></p>

    <nav id="tabBar" class="lingo-tabbar" aria-label="主選單">
      <button type="button" data-view="home"><span aria-hidden="true">🏠</span>今日</button>
      <button type="button" data-view="library"><span aria-hidden="true">📚</span>內容庫</button>
      <a href="placement.html"><span aria-hidden="true">📝</span>小考</a>
      <a href="copybook.html"><span aria-hidden="true">✍️</span>字帖</a>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="dialogModal" class="modal-overlay hidden">
    <div class="modal-card dialog-card">
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button id="dialogCancelBtn" class="ghost-btn" type="button">取消</button>
        <button id="dialogOkBtn" type="button">確定</button>
      </div>
    </div>
  </div>

  <script src="shared.js?v=20261008221212"></script>
  <script src="lingo.js?v=20261008221212"></script>
</body>
</html>
